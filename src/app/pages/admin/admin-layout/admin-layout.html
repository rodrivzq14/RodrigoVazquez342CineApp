<div class="admin">
  <aside class="menu">
    <h2>Administración</h2>
    <nav>
      @for (s of secciones; track s.ruta) {
        <a *appSiPermiso="s.permiso" [routerLink]="s.ruta" routerLinkActive="activo">{{ s.nombre }}</a>
      }
      <a *appSiRol="['admin']" routerLink="roles" routerLinkActive="activo">Roles</a>
    </nav>
  </aside>

  <section class="contenido">
    <router-outlet />
  </section>
</div>
