<main class="wrap">
  <form class="card" [formGroup]="form" (ngSubmit)="enviar()">
    <h1>Iniciar sesión</h1>

    @if (error()) {
      <div class="error-box">{{ error() }}</div>
    }

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email"
             [class.invalid]="form.controls.email.touched && form.controls.email.invalid" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="error-msg">Ingresá un email válido</span>
      }
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password"
             [class.invalid]="form.controls.password.touched && form.controls.password.invalid" />
    </div>

    <button class="btn" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando...' : 'Entrar' }}
    </button>

    <p class="alt">¿No tenés cuenta? <a routerLink="/registro">Registrate</a></p>
  </form>
</main>
