<nav class="nav">
  <a routerLink="/" class="logo" aria-label="El Proyector, ir a la cartelera">
    <img src="icons/logo.svg" alt="" width="36" height="36" />
    <span>El <em>Proyector</em></span>
  </a>

  <div class="links">
    <a *appSiPermiso="'validar'" routerLink="/validar">Validar QR</a>
    <a *appSiPermiso="'panel'" routerLink="/admin">Panel</a>

    @if (auth.profile(); as p) {
      <app-notificaciones />
      <a routerLink="/perfil">{{ p.nombre }}</a>
      <button type="button" class="salir" (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/login">Ingresar</a>
      <a routerLink="/registro" class="registro">Registrarme</a>
    }
  </div>
</nav>
