@if (editable()) {
  <div class="estrellas editable" [class.grande]="tamanio() === 'grande'" role="radiogroup" aria-label="Calificación"
       (mouseleave)="hover.set(0)">
    @for (n of posiciones; track n) {
      <button type="button" [class]="estado(n)" role="radio" [attr.aria-checked]="valor() === n"
              [attr.aria-label]="n + (n === 1 ? ' estrella' : ' estrellas')"
              (mouseenter)="hover.set(n)" (click)="elegir(n)">★</button>
    }
  </div>
} @else {
  <span class="estrellas" [class.grande]="tamanio() === 'grande'" [attr.aria-label]="valor() + ' de 5 estrellas'">
    @for (n of posiciones; track n) {
      <span [class]="estado(n)" aria-hidden="true">★</span>
    }
  </span>
}
